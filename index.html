<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>CoreCloud Marketplace — Dell Devices for African Teams</title>
  <meta name="description" content="Dell Latitude, Precision and XPS — curated by CoreCloud. Business-ready, MSP-friendly, SA delivery." />
  <link rel="stylesheet" href="assets/css/marketplace.css" />
  <link rel="icon" href="assets/images/corecloud-neon-logo.png" />
</head>
<body class="has-particles">
  <!-- background particles -->
  <canvas id="bgParticles" aria-hidden="true"></canvas>

  <!-- HEADER -->
  <header class="ccm-header">
    <div class="ccm-shell">
      <a href="index.html" class="ccm-brand">
        <img src="assets/images/corecloud-neon-logo.png" alt="CoreCloud" class="ccm-logo" />
        <div class="ccm-title">
          <span class="c1">CoreCloud</span>
          <span class="c2">Marketplace</span>
        </div>
      </a>
      <nav class="ccm-nav">
        <a href="#featured" class="active">Dell Laptops</a>
        <a href="accessories.html">Accessories</a>
        <a href="msp.html">MSP</a>
        <a href="terms.html">Terms</a>
      </nav>
      <div class="ccm-actions">
        <a href="cart.html" class="ccm-btn primary" id="cartCountBtn">Cart (0)</a>
      </div>
      <button class="ccm-burger" id="menuToggle" aria-label="Toggle Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="ccm-section" id="featured">
    <div class="ccm-shell section-head search-row">
      <div>
        <h2>Dell Laptops</h2>
        <p>Latitude, Precision, XPS — CoreCloud verified.</p>
      </div>
      <input type="text" class="search-input" id="searchBox" placeholder="Search Dell model, series or RAM..." />
    </div>

    <div class="ccm-shell product-grid" id="productGrid">
      <!-- products will render here -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="ccm-footer">
    <div class="ccm-shell foot-grid">
      <div>
        <img src="assets/images/corecloud-neon-logo.png" alt="CoreCloud" class="footer-logo" />
        <p>CoreCloud Marketplace — Dell devices for African businesses.</p>
      </div>
      <div class="foot-links">
        <a href="#featured">Dell Laptops</a>
        <a href="accessories.html">Accessories</a>
        <a href="msp.html">MSP</a>
        <a href="terms.html">Terms</a>
      </div>
      <p class="copy">© <span id="year"></span> CoreCloud (Pty) Ltd.</p>
    </div>
  </footer>

  <script>
    // footer year
    document.getElementById('year').textContent = new Date().getFullYear();

    // mobile nav
    const menuToggle = document.getElementById('menuToggle');
    const nav = document.querySelector('.ccm-nav');
    menuToggle.addEventListener('click', () => nav.classList.toggle('open'));

    // cart utils
    function getCart(){ return JSON.parse(localStorage.getItem('ccm-cart') || '[]'); }
    function setCart(c){ localStorage.setItem('ccm-cart', JSON.stringify(c)); }
    function updateCartCount(){
      const c = getCart();
      const btn = document.getElementById('cartCountBtn');
      if(btn) btn.textContent = `Cart (${c.length})`;
    }
    updateCartCount();

    // data
    let ALL_PRODUCTS = [];

    async function loadProducts(){
      try{
        const res = await fetch('assets/data/products.json');
        const data = await res.json();
        ALL_PRODUCTS = data;
        renderProducts(data);
      }catch(e){
        console.warn('Could not load products.json', e);
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '<p class="empty">Could not load product list.</p>';
      }
    }

    function renderProducts(list){
      const grid = document.getElementById('productGrid');
      if(!list || list.length === 0){
        grid.innerHTML = '<p class="empty">No Dell devices match your search.</p>';
        return;
      }
      grid.innerHTML = list.map(p => {
        const img = `
          <img src="${p.image || 'assets/images/dell-placeholder.jpg'}"
               alt="${p.name}"
               class="p-img-real"
               onerror="this.onerror=null;this.src='assets/images/dell-placeholder.jpg';" />
        `;
        return `
          <article class="product-card">
            ${img}
            <h3>${p.name}</h3>
            <p class="p-sub">${p.cpu} / ${p.ram} / ${p.storage}</p>
            <p class="p-price">R ${p.price.toLocaleString()}</p>
            <div class="p-actions">
              <button class="ccm-btn small primary" data-sku="${p.sku}">Add</button>
              <a href="product-dell.html?sku=${encodeURIComponent(p.sku)}" class="ccm-btn small ghost">Details</a>
            </div>
          </article>
        `;
      }).join('');

      // add-to-cart buttons
      grid.querySelectorAll('button[data-sku]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          const sku = btn.dataset.sku;
          const item = ALL_PRODUCTS.find(x => x.sku === sku);
          if(!item) return;
          const cart = getCart();
          cart.push({
            sku: item.sku,
            name: item.name,
            price: item.price,
            qty: 1
          });
          setCart(cart);
          updateCartCount();
          alert('Added to cart');
        });
      });
    }

    // search
    const searchBox = document.getElementById('searchBox');
    searchBox.addEventListener('input', e=>{
      const q = e.target.value.toLowerCase();
      const filtered = ALL_PRODUCTS.filter(p => {
        return (
          p.name.toLowerCase().includes(q) ||
          (p.category && p.category.toLowerCase().includes(q)) ||
          (p.cpu && p.cpu.toLowerCase().includes(q)) ||
          (p.ram && p.ram.toLowerCase().includes(q))
        );
      });
      renderProducts(filtered);
    });

    loadProducts();

    // particles
    (function(){
      const c = document.getElementById('bgParticles');
      if(!c) return;
      const ctx = c.getContext('2d');
      let w, h;
      function resize(){
        w = c.width = window.innerWidth;
        h = c.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      const COUNT = 40;
      const parts = Array.from({length:COUNT}).map(()=>({
        x: Math.random()*w,
        y: Math.random()*h,
        r: 1.2 + Math.random()*2.4,
        vx: -.25 + Math.random()*.5,
        vy: -.25 + Math.random()*.5,
        o: .2 + Math.random()*.4
      }));

      function tick(){
        ctx.clearRect(0,0,w,h);
        for(const p of parts){
          p.x += p.vx;
          p.y += p.vy;
          if(p.x < -20) p.x = w+10;
          if(p.x > w+20) p.x = -10;
          if(p.y < -20) p.y = h+10;
          if(p.y > h+20) p.y = -10;

          const grad = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*4);
          grad.addColorStop(0, `rgba(0,198,255,${p.o+0.15})`);
          grad.addColorStop(0.8, `rgba(255,210,63,0)`);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(p.x,p.y,p.r*4,0,Math.PI*2);
          ctx.fill();
        }
        requestAnimationFrame(tick);
      }
      tick();
    })();
  </script>
</body>
</html>
