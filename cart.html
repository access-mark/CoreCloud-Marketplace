<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // mobile nav
  const menuToggle = document.getElementById('menuToggle');
  const nav = document.querySelector('.ccm-nav');
  if(menuToggle) menuToggle.addEventListener('click', () => nav.classList.toggle('open'));

  // cart utils
  function getCart(){ return JSON.parse(localStorage.getItem('ccm-cart') || '[]'); }
  function setCart(c){ localStorage.setItem('ccm-cart', JSON.stringify(c)); }
  function updateCartCount(){
    const c = getCart();
    const btn = document.getElementById('cartCountBtn');
    if(btn) btn.textContent = `Cart (${c.length})`;
  }

  // Totals state
  let CURRENT_TOTAL_EXCL = 0, CURRENT_VAT = 0, CURRENT_TOTAL_INCL = 0;

  // --- LOGIN GATE (fresh user each time) ---
  const gate = document.getElementById('loginGate');
  const submitBtn = document.getElementById('submitBtn');

  function enforceLogin(){
    const user = CCMAuth.getUser();            // <— refresh every call
    if(!user || !user.email || !user.phone){
      gate.style.display = 'block';
      if(submitBtn) submitBtn.disabled = true;
    } else {
      gate.style.display = 'none';
      if(submitBtn) submitBtn.disabled = false;
      // Prefill form (only if blank so user edits persist)
      const f = (id, val)=>{
        const el = document.getElementById(id);
        if(el && val && !el.value) el.value = val;
      };
      f('email', user.email);
      f('phone', user.phone);
      f('company', user.company);
      f('contact', [user.first_name, user.last_name].filter(Boolean).join(' '));
      f('vat', user.vat);
      f('address', user.delivery);
      const up = document.getElementById('user_profile_json');
      if(up) up.value = JSON.stringify(user);
    }
  }

  // --- CART RENDER (unchanged) ---
  function renderCart(){
    const cart = getCart();
    const box = document.getElementById('cartItems');
    const sum = document.getElementById('summary');

    if(cart.length === 0){
      box.innerHTML = '<p class="empty">No items yet. Add Dell laptops from the marketplace.</p>';
      sum.innerHTML = '<div class="summary-line"><span>Subtotal</span><span>R 0</span></div>';
      CURRENT_TOTAL_EXCL = 0; CURRENT_VAT = 0; CURRENT_TOTAL_INCL = 0;
      syncTotalsToForm();
      updateSageLink();
      return;
    }

    let html = '', subtotal = 0;
    cart.forEach((item, idx)=>{
      const qty = item.qty && item.qty > 0 ? item.qty : 1;
      const line = item.price * qty;
      subtotal += line;
      html += `
        <div class="cart-item">
          <div>
            <h3>${item.name}</h3>
            <p style="font-size:.7rem;color:rgba(156,169,198,1);">SKU: ${item.sku}</p>
          </div>
          <div style="text-align:right;">
            <input type="number" min="1" value="${qty}" data-idx="${idx}" class="qty-input" />
            <p style="font-size:.75rem;margin-top:.35rem;">R ${line.toLocaleString()}</p>
            <button data-remove="${idx}" style="background:none;border:none;color:rgba(255,88,88,.8);font-size:.65rem;margin-top:.25rem;cursor:pointer;">Remove</button>
          </div>
        </div>
      `;
    });

    box.innerHTML = html;

    const vat = Math.round(subtotal * 0.15);
    const total = subtotal + vat;
    CURRENT_TOTAL_EXCL = subtotal; CURRENT_VAT = vat; CURRENT_TOTAL_INCL = total;

    sum.innerHTML = `
      <div class="summary-line"><span>Subtotal (excl.)</span><span>R ${subtotal.toLocaleString()}</span></div>
      <div class="summary-line"><span>VAT 15%</span><span>R ${vat.toLocaleString()}</span></div>
      <div class="summary-line total"><span>Total (incl.)</span><span>R ${total.toLocaleString()}</span></div>
    `;

    box.querySelectorAll('.qty-input').forEach(inp=>{
      inp.addEventListener('change', e=>{
        const i = e.target.getAttribute('data-idx');
        const cart = getCart();
        let val = parseInt(e.target.value, 10);
        if(isNaN(val) || val < 1) val = 1;
        cart[i].qty = val;
        setCart(cart);
        renderCart();
        updateCartCount();
      });
    });

    box.querySelectorAll('[data-remove]').forEach(btn=>{
      btn.addEventListener('click', e=>{
        const i = e.target.getAttribute('data-remove');
        const cart = getCart();
        cart.splice(i,1);
        setCart(cart);
        renderCart();
        updateCartCount();
      });
    });

    syncTotalsToForm();
    updateSageLink();
  }

  function syncTotalsToForm(){
    const setVal = (id, val)=>{ const el = document.getElementById(id); if(el) el.value = val; };
    setVal('cart_total_excl', `R ${CURRENT_TOTAL_EXCL.toLocaleString()}`);
    setVal('cart_vat', `R ${CURRENT_VAT.toLocaleString()}`);
    setVal('cart_total_incl', `R ${CURRENT_TOTAL_INCL.toLocaleString()}`);
    const finance_amount = document.getElementById('finance_amount');
    if(finance_amount) finance_amount.value = `R ${CURRENT_TOTAL_INCL.toLocaleString()}`;
  }

  // Payment choice UI (unchanged)
  const radios = ['pm_finance','pm_po','pm_call','pm_card'];
  const blocks = { pm_finance:'financeFields', pm_po:'poFields', pm_call:'callFields', pm_card:'cardFields' };
  function hideAllDetails(){ Object.values(blocks).forEach(id=>{ const el = document.getElementById(id); if(el) el.style.display='none'; }); }
  function showDetail(id){
    hideAllDetails();
    const el = document.getElementById(blocks[id]);
    if(el) el.style.display = 'block';
    const chosen = document.getElementById(id);
    if(chosen) document.getElementById('payment_method').value = chosen.value;
  }
  radios.forEach(id=>{ const r = document.getElementById(id); if(r) r.addEventListener('change', ()=> showDetail(id)); });

  function updateSageLink(){
    const btn = document.getElementById('sagePayBtn');
    if(!btn) return;
    const base = 'https://pay.sage.com/YOUR-MERCHANT-ID';
    const amount = CURRENT_TOTAL_INCL.toFixed(2);
    const ref = encodeURIComponent('CoreCloud Marketplace Order');
    btn.href = `${base}?amount=${amount}&reference=${ref}`;
  }

  // Submit guard with clear reasons
  document.getElementById('checkoutForm').addEventListener('submit', (e)=>{
    const u = CCMAuth.getUser();
    if(!u || !u.email || !u.phone){
      e.preventDefault();
      alert('Please login first (email + phone required).');
      location.href = 'login.html?from=cart';
      return;
    }

    // ensure required fields are present (some aren’t prefilled by profile)
    const requiredIds = ['company','contact','email','phone'];
    for(const id of requiredIds){
      const el = document.getElementById(id);
      if(!el || !el.value.trim()){
        e.preventDefault();
        alert('Please complete Company, Contact, Email and Phone before submitting.');
        el && el.focus();
        return;
      }
    }

    // payment method must be chosen
    const chosen = document.querySelector('input[name="payment_choice"]:checked');
    if(!chosen){
      e.preventDefault();
      alert('Please select a payment option.');
      return;
    }
    document.getElementById('payment_method').value = chosen.value;

    // cart dump
    const cart = getCart();
    const cartText = cart.map(i => `${i.qty || 1} × ${i.name} — R${i.price.toLocaleString()} (SKU: ${i.sku})`).join('\n');
    document.getElementById('cart_contents').value = cartText;
    document.getElementById('user_profile_json').value = JSON.stringify(u);
  });

  // Init
  updateCartCount();
  enforceLogin();        // fresh check on load
  renderCart();

  // Also re-check on visibility change (in case user logs in in another tab)
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ enforceLogin(); } });
</script>
