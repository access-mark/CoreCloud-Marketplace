<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Accessories — CoreCloud Marketplace</title>
  <meta name="description" content="Dell docks, monitors, headsets and carry cases to complete your laptop rollout." />
  <link rel="stylesheet" href="assets/css/marketplace.css" />
  <link rel="icon" href="assets/images/corecloud-neon-logo.png" />
  <script defer src="assets/js/auth.js"></script>
  <style>
    /* tidy cards + prevent image distortion */
    .p-img-real{width:100%;height:auto;object-fit:contain;display:block;border-radius:12px;border:1px solid rgba(255,255,255,.06)}
    .product-card h3{min-height:auto}
  </style>
</head>
<body>
  <!-- HEADER -->
  <header class="ccm-header">
    <div class="ccm-shell">
      <a href="index.html" class="ccm-brand">
        <img src="assets/images/corecloud-neon-logo.png" alt="CoreCloud" class="ccm-logo" />
        <div class="ccm-title">
          <span class="c1">CoreCloud</span>
          <span class="c2">Marketplace</span>
        </div>
      </a>
      <nav class="ccm-nav">
        <a href="index.html#featured">Dell Laptops</a>
        <a href="accessories.html" class="active">Accessories</a>
        <a href="msp.html">MSP</a>
        <a href="terms.html">Terms</a>
        <a href="login.html">Login</a>
      </nav>
      <div class="ccm-actions">
        <a href="cart.html" class="ccm-btn primary" id="cartCountBtn">Cart (0)</a>
      </div>
      <button class="ccm-burger" id="menuToggle" aria-label="Toggle Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- BODY -->
  <main class="ccm-section">
    <div class="ccm-shell section-head">
      <div>
        <h2>Accessories</h2>
        <p>Add docks, screens and headsets to your Dell order.</p>
      </div>
      <div class="filters">
        <span class="pill active">All</span>
      </div>
    </div>

    <div class="ccm-shell product-grid" id="accGrid" aria-live="polite">
      <!-- rendered via JS -->
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="ccm-footer">
    <div class="ccm-shell foot-grid">
      <div>
        <img src="assets/images/corecloud-neon-logo.png" alt="CoreCloud" class="footer-logo" />
        <p>CoreCloud Marketplace — Dell devices for African businesses.</p>
      </div>
      <div class="foot-links">
        <a href="index.html">Home</a>
        <a href="index.html#featured">Dell Laptops</a>
        <a href="accessories.html">Accessories</a>
        <a href="msp.html">MSP</a>
        <a href="terms.html">Terms</a>
        <a href="login.html">Login</a>
      </div>
      <p class="copy">© <span id="year"></span> CoreCloud (Pty) Ltd.</p>
    </div>
  </footer>

  <script>
    // year
    document.getElementById('year').textContent = new Date().getFullYear();

    // mobile nav
    const menuToggle = document.getElementById('menuToggle');
    const nav = document.querySelector('.ccm-nav');
    if(menuToggle) menuToggle.addEventListener('click', () => nav.classList.toggle('open'));

    // cart utils
    function getCart(){ return JSON.parse(localStorage.getItem('ccm-cart') || '[]'); }
    function setCart(c){ localStorage.setItem('ccm-cart', JSON.stringify(c)); }
    function updateCartCount(){
      const c = getCart();
      const btn = document.getElementById('cartCountBtn');
      if(btn) btn.textContent = `Cart (${c.length})`;
    }
    updateCartCount();

    // ========= Accessories data (images under /assets/images/dell/) =========
    // Each item has multiple candidate filenames (common naming variants).
    const ACCESSORIES = [
      {
        sku: "dell-wd19s-dock",
        name: "Dell WD19S USB-C Dock",
        price: 4890,
        desc: "Single-cable docking for Latitude / Precision / XPS.",
        images: [
          "assets/images/dell/wd19s.jpg",
          "assets/images/dell/dell-dock-wd19s.jpg",
          "assets/images/dell/dock-wd19s.jpg"
        ]
      },
      {
        sku: "dell-24-monitor",
        name: "Dell 24\" FHD Monitor",
        price: 2890,
        desc: "Business-class 24\" FHD monitor.",
        images: [
          "assets/images/dell/monitor-24.jpg",
          "assets/images/dell/dell-24-monitor.jpg",
          "assets/images/dell/monitor-24-fhd.jpg"
        ]
      },
      {
        sku: "dell-27-monitor-uhd",
        name: "Dell 27\" 4K Monitor",
        price: 6290,
        desc: "4K for creators and leadership.",
        images: [
          "assets/images/dell/monitor-27-4k.jpg",
          "assets/images/dell/dell-27-monitor-uhd.jpg",
          "assets/images/dell/monitor-27.jpg"
        ]
      },
      {
        sku: "logitech-h390",
        name: "Logitech H390 USB Headset",
        price: 950,
        desc: "Teams / Zoom ready.",
        images: [
          "assets/images/dell/logitech-h390.jpg",
          "assets/images/dell/h390.jpg"
        ]
      },
      {
        sku: "dell-slipcase-14",
        name: "Dell Slipcase 14\"",
        price: 590,
        desc: "Protect Latitude devices.",
        images: [
          "assets/images/dell/slipcase-14.jpg",
          "assets/images/dell/dell-slipcase-14.jpg"
        ]
      }
    ];

    const grid = document.getElementById('accGrid');

    // progressive image fallback: try next candidate on error, then placeholder
    function nextSrc(img){
      const list = JSON.parse(img.dataset.candidates || "[]");
      let i = Number(img.dataset.idx || "0");
      i++;
      if(i < list.length){
        img.dataset.idx = String(i);
        img.src = list[i];
      }else{
        img.onerror = null;
        img.src = "assets/images/dell-placeholder.jpg";
      }
    }

    // render
    grid.innerHTML = ACCESSORIES.map(a => {
      const first = a.images[0];
      const candidates = JSON.stringify(a.images).replace(/"/g, "&quot;");
      return `
        <article class="product-card">
          <img
            src="${first}"
            alt="${a.name}"
            class="p-img-real"
            loading="lazy"
            data-candidates="${candidates}"
            data-idx="0"
            onerror="nextSrc(this)"
          />
          <h3>${a.name}</h3>
          <p class="p-sub">${a.desc}</p>
          <p class="p-price">R ${a.price.toLocaleString()}</p>
          <div class="p-actions">
            <button class="ccm-btn small primary" data-sku="${a.sku}">Add</button>
          </div>
        </article>
      `;
    }).join('');

    // bind add-to-cart
    grid.querySelectorAll('button[data-sku]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const sku = btn.dataset.sku;
        const item = ACCESSORIES.find(x=>x.sku === sku);
        const cart = getCart();
        cart.push({ sku: item.sku, name: item.name, price: item.price, qty: 1 });
        setCart(cart);
        updateCartCount();
        alert('Added to cart');
      });
    });

    // expose nextSrc for inline handler
    window.nextSrc = nextSrc;
  </script>
</body>
</html>
