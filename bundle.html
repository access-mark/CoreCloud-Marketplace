<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />

<title>Bundle — CoreCloud Marketplace</title>
<meta name="description" content="Promotion bundle details — CoreCloud Marketplace." />

<link rel="stylesheet" href="assets/css/marketplace.css" />
<link rel="icon" href="assets/images/corecloud-neon-logo.png" />
<meta name="theme-color" content="#050b18" />
<link rel="canonical" href="https://www.corecloud-marketplace.com/bundle.html" />

<style>
.pd-page{ padding:3rem 0 2.5rem; }
.crumbs{ font-size:.75rem; opacity:.7; margin-bottom:1rem; }
.crumbs a{ text-decoration:underline; }

.pd-top{
  display:grid;
  grid-template-columns:1.2fr 1fr;
  gap:2rem;
  margin-bottom:2rem;
}

.pill-tag{
  display:inline-block;
  font-size:.7rem;
  letter-spacing:.12em;
  text-transform:uppercase;
  border-radius:999px;
  padding:.3rem .8rem;
  background:linear-gradient(135deg,#facc15,#f5b400);
  color:#050b18;
  font-weight:700;
  margin-bottom:.75rem;
}

.pd-title{ font-size:1.8rem; margin:.25rem 0 .75rem; }

.price-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1rem;
  border-radius:16px;
  background:rgba(9,18,40,.9);
  border:1px solid rgba(0,198,255,.3);
  box-shadow:0 0 25px rgba(0,198,255,.2);
  margin:.8rem 0;
}

.price-label{
  font-size:.75rem;
  letter-spacing:.14em;
  text-transform:uppercase;
  opacity:.7;
}

.price-val{
  font-size:1.3rem;
  font-weight:900;
  color:#facc15;
  white-space:nowrap;
  text-shadow:0 0 20px rgba(250,204,21,.6);
}

.bundle-warning{
  margin-top:.75rem;
  font-size:.85rem;
  color:#ffd23f;
  border-left:3px solid #facc15;
  padding-left:.75rem;
}

.pd-block{
  border-radius:18px;
  padding:1.4rem;
  background:rgba(9,18,40,.92);
  border:1px solid rgba(0,198,255,.2);
  box-shadow:0 16px 40px rgba(0,0,0,.6);
}

.spec-table{
  width:100%;
  border-collapse:collapse;
  font-size:.85rem;
}

.spec-table th,
.spec-table td{
  padding:.55rem .4rem;
  border-bottom:1px solid rgba(255,255,255,.06);
  text-align:left;
}

.related-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:1.25rem;
  margin-top:1rem;
}

@media (max-width:880px){
  .pd-top{ grid-template-columns:1fr; }
}
</style>
</head>

<body>

<header class="ccm-header">
  <div class="ccm-shell ccm-header-inner">
    <a href="index.html" class="ccm-brand">
      <img src="assets/images/corecloud-neon-logo.png" class="ccm-logo">
      <div class="ccm-brand-text">
        <span class="ccm-brand-title">CoreCloud Marketplace</span>
        <span class="ccm-brand-tagline">Promotional bundles</span>
      </div>
    </a>
  </div>
</header>

<main class="ccm-main">
<section class="ccm-shell pd-page">

<p class="crumbs">
<a href="index.html">Marketplace</a> /
<span id="crumbPromo">Promotion</span>
</p>

<div class="pd-top">

<div>
<span class="pill-tag" id="promoBadge">Promotion</span>
<h1 class="pd-title" id="bundleTitle">Loading...</h1>

<div class="price-row">
  <div>
    <div class="price-label">Total Promotion Price</div>
  </div>
  <div class="price-val" id="bundlePrice">—</div>
</div>

<div class="bundle-warning">
Bundle cannot be split or altered. Taken as-is.
</div>

<div style="margin-top:1rem;display:flex;gap:.75rem;flex-wrap:wrap;">
  <button class="ccm-btn primary" id="addToCartBtn">Add Bundle</button>
  <a href="cart.html?quote=1" class="ccm-btn ghost">Request Quote</a>
</div>

</div>

<div class="pd-block">
<h3>Bundle Overview</h3>
<p id="bundleMeta"></p>
<ul id="bundleMetaList" style="list-style:none;padding-left:0;margin:0;"></ul>
</div>

</div>

<div class="pd-block">
<h3>Item Lines</h3>
<table class="spec-table" id="itemsTable">
<thead>
<tr>
<th style="width:15%">Qty</th>
<th>Item</th>
<th style="width:25%">SKU</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>

<div class="pd-block" style="margin-top:2rem;">
<h3>Other Bundles In This Promotion</h3>
<div class="related-grid" id="relatedGrid"></div>
</div>

</section>
</main>

<script>
const params = new URLSearchParams(location.search);
const bundleName = params.get('bundle');
let ALL = [];
let CURRENT = null;

function safe(s){ return String(s||'').trim(); }
function formatZAR(n){
  const v = Number(n);
  if(!isFinite(v)) return '—';
  return 'R ' + v.toLocaleString('en-ZA',{minimumFractionDigits:2});
}

function renderBundle(b){
  CURRENT = b;
  const items = b.items || [];
  const units = items.reduce((a,i)=>a+(Number(i.qty)||0),0);

  document.title = safe(b.bundle) + ' — CoreCloud Marketplace';
  document.getElementById('promoBadge').textContent = 'Promotion ' + b.promotion_id;
  document.getElementById('crumbPromo').textContent = 'Promotion ' + b.promotion_id;
  document.getElementById('bundleTitle').textContent = safe(b.bundle);
  document.getElementById('bundlePrice').textContent = formatZAR(b.total_price);

  document.getElementById('bundleMeta').textContent =
    'Promotion ' + b.promotion_id + ' · ' +
    items.length + ' lines · ' +
    units + ' total units';

  document.getElementById('bundleMetaList').innerHTML = `
    <li>• Stock bundles: ${b.stock_bundles || 1}</li>
    <li>• Lead time: ${safe(b.lead_time) || 'Confirmed on quote'}</li>
    <li>• SA delivery</li>
  `;

  document.querySelector('#itemsTable tbody').innerHTML =
    items.map(i=>`
      <tr>
        <td>${Number(i.qty)||0}</td>
        <td>${safe(i.name)}</td>
        <td>${safe(i.sku)}</td>
      </tr>
    `).join('');

  document.getElementById('addToCartBtn').onclick = ()=>{
    const cart = JSON.parse(localStorage.getItem('ccm-cart')||'[]');
    cart.push({
      type:'bundle',
      bundle:safe(b.bundle),
      promotion_id:b.promotion_id,
      qty:1,
      total_price:b.total_price,
      items:b.items,
      lead_time:b.lead_time
    });
    localStorage.setItem('ccm-cart',JSON.stringify(cart));
    alert('Bundle added to quote cart');
  };

  renderRelated();
}

function renderRelated(){
  const related = ALL.filter(x =>
    x.promotion_id === CURRENT.promotion_id &&
    safe(x.bundle) !== safe(CURRENT.bundle)
  ).slice(0,3);

  const wrap = document.getElementById('relatedGrid');

  if(!related.length){
    wrap.innerHTML = '<p>No related bundles.</p>';
    return;
  }

  wrap.innerHTML = related.map(b=>`
    <article class="product-card">
      <p class="p-meta">Promotion ${b.promotion_id}</p>
      <h3>${safe(b.bundle)}</h3>
      <div class="price-row">
        <div class="price-label">Total</div>
        <div class="price-val">${formatZAR(b.total_price)}</div>
      </div>
      <a class="ccm-btn small ghost" href="bundle.html?bundle=${encodeURIComponent(b.bundle)}">View</a>
    </article>
  `).join('');
}

async function load(){
  const res = await fetch('assets/data/bundles.by_promotion.json?v='+Date.now(),{cache:'no-store'});
  ALL = await res.json();
  const found = ALL.find(x=>safe(x.bundle)===safe(bundleName));
  if(!found){
    document.getElementById('bundleTitle').textContent = 'Bundle not found';
    return;
  }
  renderBundle(found);
}

load();
</script>

</body>
</html>
